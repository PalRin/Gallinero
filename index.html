    background-size: 100% auto;
    background-position: top center;
    background-repeat: no-repeat;
    border-radius: 22px; overflow: hidden; display: flex; flex-direction: column;
    aspect-ratio: 9 / 16; max-height: 90vh;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  header { position: relative; padding: 16px 14px; }
  .header-content {
    position: relative; display: flex; align-items: center;
    justify-content: space-between; gap: 10px;
  }
  .brand-pill {
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 7px; color: var(--white);
    background: var(--ink); padding: 7px 12px 7px 10px; border-radius: 999px;
    border: none; cursor: pointer;
  }
  .whoami { display: flex; gap: 6px; background: var(--ink); padding: 5px; border-radius: 999px; }
  .whoami input {
    background: rgba(255,255,255,0.12); border: none;
    color: var(--white); border-radius: 999px; padding: 6px 10px; font-size: 12.5px; width: 100px;
  }
  .whoami input::placeholder { color: rgba(255,255,255,0.5); }
  .whoami button {
    background: var(--yolk); color: var(--ink); border: none; border-radius: 999px;
    padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  #whoamiBox { display: flex; align-items: center; gap: 6px; }
  .hi {
    font-size: 12.5px; font-weight: 500; color: var(--white);
    background: var(--ink); padding: 7px 14px; border-radius: 999px;
  }
  .logout-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: var(--ink); color: var(--yolk); font-size: 13px; cursor: pointer;
  }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
  .badge {
    position: relative; background: var(--yolk);
    border-radius: 20px; padding: 22px 90px 24px 20px; text-align: left; margin-bottom: 16px;
  }
  .badge-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(16,16,16,0.65); font-weight: 600; }
  .badge-name { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: var(--ink); margin-top: 2px; }
  .badge-week { font-size: 12.5px; color: rgba(16,16,16,0.7); margin-top: 2px; }
  .badge-hint { font-size: 10.5px; color: rgba(16,16,16,0.55); margin-top: 6px; font-style: italic; }
  .day-picker { background: var(--white); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
  .day-picker-label { font-size: 12.5px; font-weight: 600; color: var(--klein); margin-bottom: 8px; }
  .day-picker-days { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-picker-days button {
    background: rgba(1,76,135,0.08); color: var(--klein); border: none; border-radius: 8px;
    padding: 6px 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; text-transform: capitalize;
  }
  .day-picker-days button.active { background: var(--yolk); color: var(--ink); }
  .cal-info { font-size: 12.5px; text-align: center; margin: 10px 0 0; color: var(--ink); }
  .identify {
    background: var(--white); border: 2px solid var(--yolk); border-radius: 20px;
    padding: 28px 20px; text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 6px; margin-bottom: 14px;
  }
  .identify h2 { font-family: 'Space Grotesk', sans-serif; font-size: 19px; margin: 8px 0 0; color: var(--ink); }
  .identify p { font-size: 13px; opacity: 0.6; margin: 0 0 10px; }
  .identify-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .identify-options button {
    background: var(--klein); color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .identify .row { width: 100%; margin-top: 4px; }
  .login-required {
    background: var(--white); border-radius: 20px; padding: 40px 20px; margin-top: 10%;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .login-required p { font-size: 14px; opacity: 0.7; margin: 4px 0; }
  .badge-mark { position: absolute; top: 50%; right: 16px; transform: translateY(-50%); }
  .card { background: var(--white); border: 2px solid var(--yolk); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .card-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 6px; color: var(--klein); margin-bottom: 10px; }
  .card-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-title-row .card-title { margin-bottom: 0; }
  .link-btn { background: none; border: none; color: var(--klein); font-weight: 600; font-size: 13px; cursor: pointer; }
  .link-btn.muted { color: var(--ink); opacity: 0.4; }
  .auth-links { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 10px; }
  .auth-error { color: #C0392B; font-size: 12.5px; margin: 4px 0; text-align: center; }
  .auth-notice { color: var(--klein); font-size: 12.5px; margin: 4px 0; text-align: center; }
  .btn-icon-wide {
    background: var(--klein); color: #fff; border: none; border-radius: 999px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .identify {
    background: var(--white); border: 2px solid var(--yolk); border-radius: 20px;
    padding: 32px 20px; text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 6px; margin-top: 10%;
  }
  .identify h2 { font-family: 'Space Grotesk', sans-serif; font-size: 19px; margin: 8px 0 0; color: var(--ink); }
  .identify p { font-size: 13px; opacity: 0.6; margin: 0 0 10px; }
  .identify-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .identify-options button {
    background: var(--klein); color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .identify .row { width: 100%; margin-top: 4px; }
  .entry-title-input {
    width: 100%; border: none; border-bottom: 1px solid rgba(16,16,16,0.15);
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14.5px;
    color: var(--klein); padding: 4px 0 8px; margin-bottom: 8px; background: none;
  }
  .entry-actions { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .add-entry {
    width: 100%; background: rgba(255,255,255,0.92); border: 2px dashed rgba(1,76,135,0.45); color: var(--klein);
    border-radius: 14px; padding: 12px; font-weight: 600; font-size: 13.5px; cursor: pointer;
  }
  .add-entry.small { padding: 8px; font-size: 12.5px; margin-top: 10px; }
  .hen-meta { font-size: 12px; opacity: 0.55; margin: -6px 0 10px; text-align: center; }
  .empty-chip {
    background: var(--white); color: rgba(16,16,16,0.7); border-radius: 12px;
    padding: 12px 14px; font-size: 13px; text-align: center; margin-bottom: 12px;
  }
  .pill-btn {
    background: var(--white); color: var(--ink); border: 2px solid var(--yolk);
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 600;
    font-family: 'Inter', sans-serif; cursor: pointer;
  }
  .hen-name-chip {
    background: var(--white); border: 2px solid var(--yolk); border-radius: 14px;
    padding: 8px 16px; text-align: center; display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }
  .hen-name-row {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; color: var(--ink);
  }
  .hen-chip-meta { font-size: 12px; color: rgba(16,16,16,0.6); }
  .hens-title {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; color: var(--ink);
    background: var(--white); border: 2px solid var(--yolk); border-radius: 12px; padding: 6px 14px;
  }
  .hen-card {
    background: var(--yolk); border-radius: 18px; padding: 16px;
    margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer;
  }
  .hen-thumb-lg {
    width: 60px; height: 60px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: rgba(16,16,16,0.1); display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .hen-thumb-lg img { width: 100%; height: 100%; object-fit: cover; }

const AVOID_PAIRS = [["german","rosa"], ["oskar","susana"]];

// Lista de miembros ordenada alfabéticamente, para mostrar siempre igual
// en botones, listas y desplegables (no cambia el orden guardado).
function sortedMembers() {
  return [...members].sort((a, b) => a.name.localeCompare(b.name, "es"));
}

// Turnos en orden cronológico (por fecha de inicio), útil porque a veces se
// añaden o se intercambian a mano y no siempre en el orden correcto.
function sortedTurnos() {
  return [...turnos].sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
}
function normalizeName(s) { return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
function isForbiddenPair(a, b) {
  const na = normalizeName(a), nb = normalizeName(b);
  return AVOID_PAIRS.some(([x,y]) => (x===na && y===nb) || (x===nb && y===na));
}
function computeSettlements(exps, memberNames, settledPayments) {
  settledPayments = settledPayments || [];
  const totals = {};
  memberNames.forEach(n => totals[n] = 0);
  exps.forEach(e => { if (totals[e.member] === undefined) totals[e.member] = 0; totals[e.member] += e.amount; });
  const allNames = memberNames.length ? memberNames : Object.keys(totals);
  const totalSum = exps.reduce((s,e) => s + e.amount, 0);
  const share = allNames.length ? totalSum / allNames.length : 0;
  const balances = allNames.map(name => ({ name, balance: Math.round(((totals[name]||0) - share) * 100) / 100 }));
  settledPayments.forEach(p => {
    const from = balances.find(b => b.name === p.from);
    const to = balances.find(b => b.name === p.to);
    if (from) from.balance = Math.round((from.balance + p.amount) * 100) / 100;
    if (to) to.balance = Math.round((to.balance - p.amount) * 100) / 100;
  });
  const creditors = balances.filter(b => b.balance > 0.005).map(b => ({...b})).sort((a,b) => b.balance - a.balance);
  const debtors = balances.filter(b => b.balance < -0.005).map(b => ({...b, balance: -b.balance})).sort((a,b) => b.balance - a.balance);
  const settlements = [];
  let i=0, j=0;
  while (i < debtors.length && j < creditors.length) {
    const amount = Math.min(debtors[i].balance, creditors[j].balance);
    if (amount > 0.005) settlements.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(amount*100)/100 });
    debtors[i].balance -= amount; creditors[j].balance -= amount;
    if (debtors[i].balance <= 0.005) i++;
    if (creditors[j].balance <= 0.005) j++;
  }
  return { balances, settlements, totalSum, share };
}

});

function translateAuthError(err) {
  const code = err && err.code;
  if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "Contraseña incorrecta.";

  if (code === "auth/email-already-in-use") return "Ese email ya está registrado con otro nombre.";
  if (code === "auth/weak-password") return "La contraseña debe tener al menos 6 caracteres.";
  if (code === "auth/invalid-email") return "Ese email no es válido.";
  if (code === "auth/too-many-requests") return "Demasiados intentos, espera un momento.";
  return "Algo no ha ido bien, inténtalo otra vez.";
}

// Al tocar un nombre: si ya tiene cuenta, pide contraseña; si es un nombre
// antiguo sin cuenta todavía (de antes de añadir el login), pide completarla.
function selectMemberForLogin(name) {
  const member = members.find(m => m.name === name);
  authTargetName = name;
  authError = "";
  authNotice = "";
  authStep = (member && member.email) ? "password" : "register";
  render();
}

function startNewMemberRegistration() {
  authTargetName = "";
  authError = "";
  authNotice = "";
  authStep = "register";
  render();
}

function startDirectLogin() {
  authTargetName = "";
  authError = "";
  authNotice = "";
  authStep = "directlogin";
  render();
}

// Para cuando alguien ya tiene cuenta de verdad (email+contraseña) pero su
// nombre ya no está en la lista de miembros (por ejemplo, se borró por error).
// Inicia sesión con lo que ya existe y lo vuelve a enganchar a la lista, en
// vez de intentar crear una cuenta nueva con un email que ya está en uso.
function submitDirectLogin() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  if (!email || !password) { authError = "Rellena email y contraseña."; render(); return; }

  auth.signInWithEmailAndPassword(email, password)
    .then(() => usernamesCol.where("email", "==", email).limit(1).get())
    .then(snap => {
      if (snap.empty) {
        authError = "Esa cuenta no está asociada a ningún nombre. Dímelo y lo miramos.";
        render();
        return;
      }
      const name = snap.docs[0].id;
      if (!members.some(m => m.name === name)) {
        members.push({ name, active: true, email });
        saveMembers();
      }
      me = name;
      authStep = null;
      render();
    })
    .catch(err => { authError = translateAuthError(err); render(); });
}

function cancelAuth() {
  authStep = null;
  authTargetName = "";
  authError = "";
  authNotice = "";
  render();
}

function submitPassword() {
  const password = document.getElementById("authPassword").value;
  const member = members.find(m => m.name === authTargetName);
  if (!member || !member.email || !password) return;
  auth.signInWithEmailAndPassword(member.email, password)
    .then(() => {
      me = authTargetName;
      authStep = null;
      render();
    })
    .catch(err => { authError = translateAuthError(err); render(); });
}

function submitRegister() {
  const isNew = !authTargetName;
  const name = (isNew ? document.getElementById("authName").value : authTargetName).trim();
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  if (!name || !email || !password) { authError = "Rellena nombre, email y contraseña."; render(); return; }
  if (isNew && members.some(m => m.name.toLowerCase() === name.toLowerCase())) { authError = "Ese nombre ya existe, elígelo en la lista."; render(); return; }

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => usernamesCol.doc(name).set({ email }))
    .then(() => {
      if (members.some(m => m.name === name)) {
        members = members.map(m => m.name === name ? { ...m, email } : m);
      } else {
        members.push({ name, active: true, email });
      }
      saveMembers();
      me = name;
      authStep = null;
      render();
    })
    .catch(err => { authError = translateAuthError(err); render(); });
}

function startPasswordReset() {
  authError = "";
  authNotice = "";
  authStep = "reset";
  render();
}

function submitPasswordReset() {
  const email = document.getElementById("authResetEmail").value.trim();
  if (!email) return;
  auth.sendPasswordResetEmail(email)
    .then(() => { authNotice = "Te hemos enviado un correo para cambiar la contraseña."; authStep = null; render(); })
    .catch(err => { authError = translateAuthError(err); render(); });
}

function logout() {
  auth.signOut().then(() => {
    me = "";
    tab = "miembros";
    hensOpen = false;
    document.getElementById("whoamiBox").outerHTML = `<div id="whoamiBox"></div>`;
    render();
  });
}

function tryAutoLogin() {
  if (me) return;
  const user = auth.currentUser;
  if (!user) return;
  const match = members.find(m => m.email === user.email);
  if (match) {
    me = match.name;
    render();
  }
}

auth.onAuthStateChanged((user) => {
  authReady = true;
  if (user) tryAutoLogin();
  render();
});

function currentTurno() {
  const today = todayMidnight();
  const active = turnoCoveringDate(today);
  if (active) return active;
  const upcoming = turnos.filter(t => toDate(t.start) > today).sort((a,b) => a.start < b.start ? -1 : 1);
  return upcoming[0];
}

function render() {
  const whoamiBox = document.getElementById("whoamiBox");
  if (whoamiBox) {
    whoamiBox.innerHTML = me
      ? `<span class="hi">Hola, ${me}</span><button class="logout-btn" onclick="logout()" title="Cerrar sesión">⎋</button>`
      : "";

  const main = document.getElementById("main");
  if (hensOpen && me) {
    main.innerHTML = renderHens();
    bindEvents();
    return;
  }
  if (tab !== "miembros" && !me) {
    main.innerHTML = `
      <div class="login-required">
        <svg width="40" height="40" viewBox="0 0 32 32">
          <path d="M16 3C22 3 27 13 27 20C27 26 22 30 16 30C10 30 5 26 5 20C5 13 10 3 16 3Z" fill="#FFFFFF"/>

        </svg>
        <p>Identifícate primero en la pestaña Miembros</p>
        <button class="add-entry" onclick="tab='miembros'; document.querySelectorAll('#tabbar button').forEach(b=>b.classList.remove('active')); document.querySelector('#tabbar button[data-tab=miembros]').classList.add('active'); render();">Ir a Miembros</button>
      </div>`;

  if (tab === "info") main.innerHTML = renderInfo();
  if (tab === "mantenimiento") main.innerHTML = renderMantenimiento();
  if (tab === "compra") main.innerHTML = renderCompra();
  bindEvents();
}



function renderTurnos() {
  const ct = currentTurno();
  const today = todayMidnight();
  const ctIsFuture = ct && toDate(ct.start) > today;
  const picking = pickingDoneFor ? turnos.find(t => t.id === pickingDoneFor) : null;
  let pickerDaysHtml = "";
  if (picking) {
    let d = toDate(picking.start);
    const end = toDate(picking.end);
    const days = [];
    while (d <= end) {
      const iso = toISODate(d);
      days.push(`<button class="${picking.doneDate === iso ? "active" : ""}" onclick="setTurnoDoneDate('${picking.id}','${iso}')">${d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric"})}</button>`);

      <div class="badge-name">${ct ? ct.member : "Nadie asignado"}</div>
      ${ct ? `<div class="badge-week">${formatWeekRange(ct.start, ct.end)}</div>` : ""}

          <circle cx="16" cy="14" r="7" fill="#F5B700" stroke="#101010" stroke-width="1" stroke-opacity="0.3"/>
        </svg>
      </span>
    </div>

    ${picking ? `
      <div class="day-picker" onclick="event.stopPropagation()">
        <div class="day-picker-label">¿Qué día se hizo la limpieza?</div>
        <div class="day-picker-days">${pickerDaysHtml}</div>

    <div class="card">
      <div class="cal-header">
        <button class="cal-nav" onclick="shiftMonth(-1)">‹</button>
        <span class="cal-title">${calMonth.toLocaleDateString("es-ES", {month:"long", year:"numeric"})}</span>
        <button class="cal-nav" onclick="shiftMonth(1)">›</button>
      </div>
      <div class="cal-grid">
        ${["L","M","X","J","V","S","D"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
        ${Array.from({length: startWeekdayOfMonth(calMonth)}).map(() => `<div></div>`).join("")}
        ${Array.from({length: daysInMonth(calMonth)}).map((_, i) => {
          const dayNum = i+1;
          const dateObj = new Date(calMonth.getFullYear(), calMonth.getMonth(), dayNum);
          const iso = toISODate(dateObj);
          const match = turnoCoveringDate(dateObj);
          const doneTurno = turnos.find(t => t.doneDate === iso);
          const isToday = dateObj.getTime() === today.getTime();
          const isPast = match && toDate(match.end) < today;
          const isFuture = match && toDate(match.start) > today;
          const cls = ["cal-day"];
          if (doneTurno) cls.push("has-turno");
          else if (match && !isPast) cls.push(isFuture ? "future-turno" : "has-turno");
          if (isToday) cls.push("is-today");
          const clickAttr = doneTurno ? `onclick="showCalInfo('${dateObj.toLocaleDateString("es-ES",{day:"numeric",month:"long"})}','${doneTurno.member}')" style="cursor:pointer"` : "";
          return `<div class="${cls.join(" ")}" title="${doneTurno ? doneTurno.member : match ? match.member : ""}" ${clickAttr}>${dayNum}</div>`;
        }).join("")}

                <rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="15" x2="16" y2="15"/>

        <div class="row"><input id="authEmail" type="email" placeholder="Tu email" /></div>
        <div class="row">
          <input id="authPassword" type="password" placeholder="Contraseña (mínimo 6 caracteres)" value="${isNew ? "" : authTargetName}" onkeydown="if(event.key==='Enter') submitRegister()" />
          <button class="btn-icon" onclick="submitRegister()">→</button>
        </div>
        <div class="auth-links">
          ${authError && authError.indexOf("ya está registrado") !== -1 ? `<button class="link-btn" onclick="startDirectLogin()">Ya tengo cuenta con ese email, iniciar sesión</button>` : ""}
          <button class="link-btn muted" onclick="cancelAuth()">Volver</button>
        </div>
      </div>`;
  }

  if (authStep === "directlogin") {
    return `
      <div class="identify">
        ${renderAuthLogo()}
        <h2>Ya tengo cuenta</h2>
        <p>Por ejemplo, si tu nombre se borró de la lista pero tu cuenta sigue existiendo</p>

        <div class="row"><input id="authEmail" type="email" placeholder="Tu email" /></div>
        <div class="row">
          <input id="authPassword" type="password" placeholder="Tu contraseña" onkeydown="if(event.key==='Enter') submitDirectLogin()" />
          <button class="btn-icon" onclick="submitDirectLogin()">→</button>
        </div>
        <div class="auth-links">
          <button class="link-btn" onclick="startPasswordReset()">¿Olvidaste tu contraseña?</button>
          <button class="link-btn muted" onclick="cancelAuth()">Volver</button>
        </div>
      </div>`;
  }

  if (authStep === "reset") {
    return `
      <div class="identify">
        ${renderAuthLogo()}
        <h2>Recuperar contraseña</h2>
        <p>Te mandamos un enlace a tu email para elegir una nueva</p>

  // Pantalla inicial: elegir nombre de la lista, o registrar uno nuevo

          <select id="editLogAction">

function toggleTurno(id) { turnos = turnos.map(t => t.id === id ? { ...t, done: !t.done } : t); saveTurnos(); render(); }
function toggleTurnoFlag(id, flag) { turnos = turnos.map(t => t.id === id ? { ...t, [flag]: !t[flag] } : t); saveTurnos(); render(); }

function generateProposals() {
  const activeNames = members.filter(m => m.active).map(m => m.name);
  if (activeNames.length === 0) return;
  const sorted = [...turnos].sort((a,b) => a.end < b.end ? 1 : -1);
  const last = sorted[0];
  let cursorStart = last ? nextFridayOnOrAfter(addDays(last.end, 1)) : nextFridayOnOrAfter(new Date().toISOString().slice(0,10));
  let nextIdx = 0;
  if (last) {
    const lastIdx = activeNames.indexOf(last.member);
    nextIdx = lastIdx === -1 ? 0 : (lastIdx + 1) % activeNames.length;
  }
  const order = Array.from({length: activeNames.length}, (_, i) => activeNames[(nextIdx + i) % activeNames.length]);

  const prevMember = last ? last.member : null;
  for (let pass = 0; pass < 3; pass++) {
    let fixed = true;
    for (let i = 0; i < order.length; i++) {
      const before = i === 0 ? prevMember : order[i-1];
      if (before && isForbiddenPair(before, order[i])) {
        const swapWith = order.findIndex((cand, j) => {
          if (j <= i) return false;
          const beforeI = i === 0 ? prevMember : order[i-1];
          const afterJ = order[j+1];
          return !isForbiddenPair(beforeI, cand) && (!afterJ || !isForbiddenPair(order[i], afterJ));
        });
        if (swapWith !== -1) { [order[i], order[swapWith]] = [order[swapWith], order[i]]; fixed = false; }
      }
    }
    if (fixed) break;
  }

  proposals = [];
  for (let i = 0; i < order.length; i++) {
    const start = cursorStart;
    const end = addDays(start, 6);
    proposals.push({ id: uid(), start, end, member: order[i] });
    cursorStart = addDays(end, 1);
  }
  render();
}
function setProposalMember(id, member) { proposals = proposals.map(p => p.id === id ? { ...p, member } : p); render(); }
function approveProposal(id) {
  const p = proposals.find(x => x.id === id);
  if (!p) return;
  turnos.push({ id: uid(), start: p.start, end: p.end, member: p.member, done: false, doneDate: null, disinf: false, deparasite: false });
  proposals = proposals.filter(x => x.id !== id);
  saveTurnos();
  render();
}
function discardProposal(id) { proposals = proposals.filter(x => x.id !== id); render(); }
function approveAllProposals() {
  proposals.forEach(p => turnos.push({ id: uid(), start: p.start, end: p.end, member: p.member, done: false, doneDate: null, disinf: false, deparasite: false }));
  proposals = [];
  saveTurnos();
  render();
}
function discardAllProposals() { proposals = []; render(); }
function toggleEgg(i) {
  ponederoDraft[i] = !ponederoDraft[i];
  ponederoDraftTouched = true;
  render();
}
function ponederoDirty() { return ponederoDraft.some((v,i) => v !== ponedero[i]); }
function confirmPonedero() {
  const recogidos = ponederoDraft.filter((v,i) => v && !ponedero[i]).length;
  const llevados = ponederoDraft.filter((v,i) => !v && ponedero[i]).length;

  const lines = [];
  if (recogidos > 0) lines.push(recogidoMessage(recogidos));
  if (llevados > 0) lines.push(llevoMessage(llevados));
  if (lines.length > 0 && !confirm(lines.join("\n"))) return;

  const entries = [];
  if (recogidos > 0) entries.push({ id: uid(), member: me || "Alguien", ts: new Date().toISOString(), action: "recogio", count: recogidos });
  if (llevados > 0) entries.push({ id: uid(), member: me || "Alguien", ts: new Date().toISOString(), action: "llevo", count: llevados });
  ponederoLog = [...entries, ...ponederoLog].slice(0, 60);
  ponedero = [...ponederoDraft];
  ponederoDraftTouched = false;
  savePonedero();
  render();
}
function cancelPonedero() {
  ponederoDraft = [...ponedero];
  ponederoDraftTouched = false;
  render();
}
function startEditLog(id) { editingLogId = id; render(); }
function cancelEditLog() { editingLogId = null; render(); }

}

function addHen() {
  const name = document.getElementById("newHenName").value.trim();
  const acquired = document.getElementById("newHenDate").value;
  if (!name) return;
  hens.push({ id: uid(), name, acquired, photo: null, notes: [] });
  saveHens();
  render();
}
function removeHen(id) {
  if (!confirmFun("Vas a borrar esta gallina de la lista.")) return;
  hens = hens.filter(h => h.id !== id);
  if (selectedHenId === id) selectedHenId = null;
  saveHens();
  render();
}
function openHen(id) { selectedHenId = id; render(); }
function startEditHenName(id) { editingHenName = id; render(); }
function cancelEditHenName() { editingHenName = null; render(); }
function saveHenName(id) {
  const newName = document.getElementById("henNameInput").value.trim();
  if (!newName) return;
  if (!confirmFun("Vas a cambiar el nombre de esta gallina.")) return;
  hens = hens.map(h => h.id === id ? { ...h, name: newName } : h);
  editingHenName = null;
  saveHens();
  render();
}
function handleHenPhotoUpload(henId, file) {
  if (!file) return;
  const henBefore = hens.find(h => h.id === henId);
  if (henBefore && henBefore.photo && !confirmFun("Vas a cambiar la foto de esta gallina.")) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height, max = 500;
      if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
      else if (h > max) { w = Math.round(w * max / h); h = max; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
      hens = hens.map(hh => hh.id === henId ? { ...hh, photo: dataUrl } : hh);
      saveHens();
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function startAddNote(henId) { addingNoteFor = henId; render(); }
function cancelAddNote() { addingNoteFor = null; render(); }
function saveNewNote(henId) {
  const date = document.getElementById(`newNoteDate-${henId}`).value;

  if (!text) return;
  hens = hens.map(h => h.id === henId ? { ...h, notes: [...h.notes, { id: uid(), date, text }] } : h);
  addingNoteFor = null;
  saveHens();
  render();
}
function startEditNote(henId, noteId) { editingNote = { henId, noteId }; render(); }
function cancelEditNote() { editingNote = null; render(); }
function saveEditNote(henId, noteId) {
  const date = document.getElementById(`editNoteDate-${noteId}`).value;
  const text = document.getElementById(`editNoteText-${noteId}`).value;
  hens = hens.map(h => h.id === henId ? { ...h, notes: h.notes.map(n => n.id === noteId ? { ...n, date, text } : n) } : h);
  editingNote = null;
  saveHens();
  render();
}
function deleteNote(henId, noteId) {
  if (!confirmFun("Vas a borrar esta anotación del historial.")) return;
  hens = hens.map(h => h.id === henId ? { ...h, notes: h.notes.filter(n => n.id !== noteId) } : h);
  if (editingNote && editingNote.henId === henId && editingNote.noteId === noteId) editingNote = null;
  saveHens();
  render();
}

function openMaint(id) { selectedMaintId = id; render(); }

function startEditMaintName(id) { editingMaintName = id; render(); }

function saveMaintName(id) {

function startAddMaintEntry(itemId) { addingMaintEntryFor = itemId; render(); }
function cancelAddMaintEntry() { addingMaintEntryFor = null; render(); }
function saveNewMaintEntry(itemId) {

function startEditMaintEntry(itemId, entryId) { editingMaintEntry = { itemId, entryId }; render(); }

function deleteMaintEntry(itemId, entryId) {

    ? { ...m, entries: m.entries.filter(e => e.id !== entryId) } : m);

function toggleItem(id) { compra = compra.map(i => i.id === id ? { ...i, checked: !i.checked } : i); saveCompra(); render(); }
function removeItem(id) {

function addExpense() {
  const member = document.getElementById("newExpenseMember").value;
  const amount = parseFloat(document.getElementById("newExpenseAmount").value);
  const description = document.getElementById("newExpenseDesc").value.trim();
  if (!member || !amount || amount <= 0) return;
  expenses.unshift({ id: uid(), member, amount, description, date: new Date().toISOString().slice(0,10) });
  saveCompra();
  render();

function removeExpense(id) {

  expenses = expenses.filter(e => e.id !== id);
  saveCompra();
  render();
}

function markSettled(from, to, amount) {
  settledPayments.push({ id: uid(), from, to, amount, date: new Date().toISOString().slice(0,10) });
  saveCompra();
  render();
}
function undoSettlement(id) {
  if (!confirmFun("Vas a deshacer este pago saldado.")) return;
  settledPayments = settledPayments.filter(p => p.id !== id);
  saveCompra();
  render();
}

// ---- Conexión en tiempo real con Firestore ----
// En cuanto cualquiera cambia algo (en su móvil, en el suyo, donde sea),
// estos listeners se disparan solos aquí y refrescan la pantalla.
stateDoc("members").onSnapshot((snap) => {
  members = (snap.data() && snap.data().list) || [];
  membersLoaded = true;
  tryAutoLogin();
  render();
});
stateDoc("turnos").onSnapshot((snap) => {
  turnos = (snap.data() && snap.data().list) || [];
  turnosLoaded = true;
  render();
});
stateDoc("info").onSnapshot((snap) => {
  const data = snap.data();
  infoEntries = (data && data.entries) || (data ? [] : DEFAULT_ENTRIES);
  infoLoaded = true;
  render();
});
stateDoc("maintenance").onSnapshot((snap) => {
  const data = snap.data();
  if (data && data.items) {
    maintenanceItems = data.items;
  } else if (data && data.entries) {
    // Formato antiguo (lista plana de entradas): se agrupan por nombre en elementos
    // con varias entradas. En cuanto alguien guarde algo, ya queda en el formato nuevo.
    const byName = {};
    data.entries.forEach(e => {
      const name = (e.name || "Sin nombre").trim();
      const key = name.toLowerCase();
      if (!byName[key]) byName[key] = { id: stableId(key), name, entries: [] };
      byName[key].entries.push({ id: e.id || stableId(key + (e.date || "")), date: e.date || "", notes: e.notes || "" });
    });
    maintenanceItems = Object.values(byName);
  } else {
    maintenanceItems = [];
  }
  maintenanceLoaded = true;
  render();
});
stateDoc("compra").onSnapshot((snap) => {
  const data = snap.data() || {};
  compra = data.items || [];
  expenses = data.expenses || [];
  settledPayments = data.settledPayments || [];
  compraLoaded = true;
  render();
});
stateDoc("ponedero").onSnapshot((snap) => {
  const data = snap.data() || {};
  ponedero = data.marked || Array(PONEDERO_COUNT).fill(false);
  ponederoLog = data.log || [];
  if (!ponederoDraftTouched) ponederoDraft = [...ponedero];
  ponederoLoaded = true;
  render();
});
stateDoc("hens").onSnapshot((snap) => {
  hens = (snap.data() && snap.data().list) || [];
  hensLoaded = true;
  render();
});
render();
</script>
